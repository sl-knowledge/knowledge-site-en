name: Publish knowledge site (English edition)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/pageviews.test.mjs
      - run: npm run build
      - name: Refresh public pageview total
        env:
          UMAMI_SHARE_URL: ${{ secrets.UMAMI_SHARE_URL }}
        run: node scripts/update-public-pageviews.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  # Translation drift must be visible without blocking publication of the
  # English edition itself.
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check English pages against the Chinese source site
        env:
          SOURCE_REPO: ${{ vars.SOURCE_REPO || 'sl-knowledge/knowledge-site' }}
          SOURCE_REF: ${{ vars.SOURCE_REF || 'main' }}
        run: npm run check:sync

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
